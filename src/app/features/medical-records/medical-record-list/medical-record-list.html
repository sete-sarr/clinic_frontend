<div class="page-header">
  <h1>Dossiers médicaux</h1>
  @if (patient()) {
    <a mat-button routerLink="/medical-records">
      <mat-icon>close</mat-icon>
      Retirer le filtre patient
    </a>
  }
</div>

<div class="filters">
  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Rechercher</mat-label>
    <input
      matInput
      [value]="searchInput()"
      (input)="onSearchInput($any($event.target).value)"
      placeholder="Nom du patient, n° patient..."
    />
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>
</div>

@if (recordsResource.isLoading()) {
  <div class="loading">
    <mat-spinner diameter="32" />
  </div>
} @else if (dataSource.data.length === 0) {
  <app-empty-state icon="folder_off" message="Aucun dossier médical." />
} @else {
  <table mat-table [dataSource]="dataSource" class="records-table">
    <ng-container matColumnDef="patient">
      <th mat-header-cell *matHeaderCellDef>Patient</th>
      <td mat-cell *matCellDef="let record">{{ record.patient_display }}</td>
    </ng-container>

    <ng-container matColumnDef="allergies">
      <th mat-header-cell *matHeaderCellDef>Allergies</th>
      <td mat-cell *matCellDef="let record">{{ record.allergies || '—' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let record">
        <button mat-icon-button matTooltip="Ouvrir le dossier" (click)="openEdit(record)">
          <mat-icon>folder_open</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <mat-paginator
    [length]="totalCount()"
    [pageSize]="pageSize"
    [pageIndex]="page() - 1"
    [hidePageSize]="true"
    (page)="onPageChange($event)"
  />
}
