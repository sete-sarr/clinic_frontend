<div class="photo-picker">
  <app-avatar [src]="previewSrc()" [kind]="kind()" [name]="name()" [size]="120" />

  <div class="photo-controls">
    <div class="photo-buttons">
      <button mat-stroked-button type="button" (click)="fileInput.click()">
        <mat-icon>photo_camera</mat-icon>
        {{ (hasPhoto() ? 'photo.change' : 'photo.add') | transloco }}
      </button>
      @if (hasPhoto()) {
        <button mat-button type="button" (click)="remove()">
          <mat-icon>delete_outline</mat-icon>
          {{ 'photo.remove' | transloco }}
        </button>
      }
      <input #fileInput type="file" accept="image/png,image/jpeg" hidden (change)="onFileSelected($event)" />
    </div>

    <span class="photo-hint">{{ 'photo.hint' | transloco }}</span>

    @if (error(); as message) {
      <span class="photo-error" role="alert">{{ message }}</span>
    }

    @if (requireConsent() && hasNewFile()) {
      <mat-checkbox [checked]="consent()" (change)="consent.set($event.checked)">
        {{ 'photo.consent' | transloco }}
      </mat-checkbox>
    }
  </div>
</div>
