<mat-sidenav-container class="shell-container">
  <mat-sidenav
    #drawer
    class="shell-sidenav"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
    [fixedInViewport]="isHandset()"
  >
    <div class="brand">
      <mat-icon>local_hospital</mat-icon>
      <span>{{ 'portal.brand' | transloco }}</span>
    </div>

    <mat-nav-list>
      @for (item of navItems; track item.route) {
        <a
          mat-list-item
          [routerLink]="item.route"
          routerLinkActive="active-link"
          (click)="isHandset() && drawer.close()"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.labelKey | transloco }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="shell-header">
      @if (isHandset()) {
        <button mat-icon-button (click)="drawer.toggle()" [attr.aria-label]="'common.openMenu' | transloco">
          <mat-icon>menu</mat-icon>
        </button>
      }

      <span class="spacer"></span>

      <app-language-switcher class="header-language" />

      @if (user(); as currentUser) {
        <button mat-button [matMenuTriggerFor]="userMenu">
          <mat-icon>account_circle</mat-icon>
          {{ currentUser.first_name || currentUser.username }}
        </button>
        <mat-menu #userMenu="matMenu">
          <button mat-menu-item (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>{{ 'common.logout' | transloco }}</span>
          </button>
        </mat-menu>
      }
    </mat-toolbar>

    <main class="shell-workspace">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
